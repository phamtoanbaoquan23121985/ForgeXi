name: verify

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Prove runner and Python availability
        run: |
          set -euxo pipefail
          pwd
          python3 --version
          git --version
          test -n "$GITHUB_SHA"
