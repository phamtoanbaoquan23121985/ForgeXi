name: verify

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Install test runner
        run: python -m pip install "pytest>=8.0"
      - name: Run core tests without packaging dependency
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install editable package
        run: python -m pip install -e ".[dev]"
      - name: Verify installed import
        run: python -c "import forgexi; print(forgexi.__file__)"
