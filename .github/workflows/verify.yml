name: verify

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install package
        run: |
          set -o pipefail
          python -m pip install -e ".[dev]" 2>&1 | tee pip-install.log
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            pip-install.log
            pytest.log
          if-no-files-found: ignore
